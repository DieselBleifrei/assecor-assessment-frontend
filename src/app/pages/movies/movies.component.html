<div class="assecor-header">Filme</div>

<div class="row">
  <div *ngFor="let movie of movies" class="col-12 col-md-6 col-xl-4 item-wrapper">
    <div class="item">
      <div style="padding: 16px;">
        <div>
          <h2>{{ movie.properties.title }}</h2>
        </div>
        <div>{{ 'Direktor: '+ movie.properties.director }}</div>
        <div>{{ 'Produzenten: '+ movie.properties.producer }}</div>
        <div class="mb-2">{{ 'Erscheinungsdatum: ' + (movie.properties.release_date | date) }}</div>
        <div style="font-style: italic;">{{ movie.properties.opening_crawl }}</div>
        <button mat-button class="pl-0 mt-3" style="font-weight: 500;" [routerLink]="'/movies/' + movie.uid">Mehr Informationen</button>
      </div>
    </div>
  </div>
</div>
