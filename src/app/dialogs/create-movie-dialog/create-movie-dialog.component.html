<h2 mat-dialog-title>Film hinzufügen</h2>

<mat-dialog-content class="row">
  <mat-form-field class="col-12">
    <mat-label>Titel</mat-label>
    <input matInput/>
  </mat-form-field>
  <mat-form-field class="col-12">
    <mat-label>Direktor</mat-label>
    <input matInput/>
  </mat-form-field>
  <mat-form-field class="col-12">
    <mat-label>Produzent</mat-label>
    <input matInput/>
  </mat-form-field>
  <mat-form-field class="col-6">
    <mat-label>Erscheinungsdatum</mat-label>
    <input matInput placeholder="YYYY"/>
  </mat-form-field>
  <mat-form-field class="col-12">
    <mat-label>Beschreibung</mat-label>
    <textarea matInput></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions style="justify-content: end;">
  <button class="mr-3" mat-button [mat-dialog-close]>Schließen</button>
  <button color="primary" mat-flat-button [mat-dialog-close]>Speichern</button>
</mat-dialog-actions>
